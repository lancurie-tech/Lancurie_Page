# Deploy Firebase com branch de integração:
#
# - Push ou workflow_dispatch na branch **dev** → apenas testes/validação (sem deploy).
# - Pull request com base na **main** → preview de Hosting para validação.
# - Push ou workflow_dispatch na **main** → deploy live de Hosting + Firestore + Storage rules.
#
# Secrets necessários (produção):
#   FIREBASE_SERVICE_ACCOUNT, VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#   VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#   VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
#
# Opcional — Settings → Secrets and variables → Actions → Variables:
#   FIREBASE_PROJECT_PROD — ID de produção (senão: secret VITE_FIREBASE_PROJECT_ID, senão lancurie)

name: CI + Deploy Firebase

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Reduz aviso de deprecação Node 20 nos actions até migrarem para Node 24 por defeito.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# checks: write — FirebaseExtended/action-hosting-deploy cria check runs (ex.: "Deploy Preview").
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: Validar aplicação (dev/main/PR)
    if: |
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    concurrency:
      group: ci-validate-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      FIREBASE_GCP_PROJECT: ${{ vars.FIREBASE_PROJECT_PROD || secrets.VITE_FIREBASE_PROJECT_ID || 'lancurie' }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Confirmar secrets de build (sem imprimir valores)
        run: |
          ok=1
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            val="${!v}"
            if [ -z "$val" ]; then echo "::error::Variável $v está vazia — verifica os secrets de produção no GitHub."; ok=0; fi
          done
          if [ "$VITE_FIREBASE_PROJECT_ID" != "$FIREBASE_GCP_PROJECT" ]; then
            echo "::warning::O projectId do config Web (VITE_FIREBASE_PROJECT_ID) não coincide com o ID usado no deploy (FIREBASE_GCP_PROJECT). Alinha o secret VITE_FIREBASE_PROJECT_ID ou a variável FIREBASE_PROJECT_PROD."
          fi
          [ "$ok" = 1 ] || exit 1

  preview-main-pr:
    name: Preview Hosting (PR para main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-preview-main-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      FIREBASE_GCP_PROJECT: ${{ vars.FIREBASE_PROJECT_PROD || secrets.VITE_FIREBASE_PROJECT_ID || 'lancurie' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Hosting — preview (PR para main)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 30d
          projectId: ${{ env.FIREBASE_GCP_PROJECT }}

  deploy-prod:
    name: Produção (main)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-prod-${{ github.ref }}
      cancel-in-progress: true
    env:
      FIREBASE_GCP_PROJECT: ${{ vars.FIREBASE_PROJECT_PROD || secrets.VITE_FIREBASE_PROJECT_ID || 'lancurie' }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Hosting — live (main)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.FIREBASE_GCP_PROJECT }}

      - name: Autenticar Google Cloud (Firestore prod)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firestore + Storage rules (prod)
        run: npx firebase-tools@latest deploy --only firestore,storage --project "$FIREBASE_GCP_PROJECT" --non-interactive
